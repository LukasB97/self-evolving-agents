<svg xmlns="http://www.w3.org/2000/svg" width="592" height="597" viewBox="0 0 592 597" role="img" aria-labelledby="title desc">
<title id="title">Before the first compaction</title>
<desc id="desc">Two established results sit among the attempts and calculations that produced them.</desc>
<rect width="592" height="597" fill="white"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#24333b">
<text x="40" y="33" font-size="21" font-weight="500">Before the first compaction</text>
<text x="56" y="68" font-size="13" fill="#61717a">Start of context</text>
<rect x="56" y="86" width="496" height="36" fill="#e4e9ec"/>
<text x="72" y="110" font-size="17" >The problem</text>
<rect x="56" y="125" width="496" height="36" fill="#f1f3f4"/>
<text x="72" y="149" font-size="17" >First approach</text>
<rect x="56" y="164" width="496" height="52" fill="#f1f3f4"/>
<text x="72" y="196" font-size="17" >Calculations and conjectures</text>
<rect x="56" y="219" width="496" height="36" fill="#def0eb"/>
<text x="72" y="243" font-size="17" >First result proved</text>
<rect x="56" y="258" width="496" height="44" fill="#f1f3f4"/>
<text x="72" y="286" font-size="17" >Further attempts</text>
<rect x="56" y="305" width="496" height="36" fill="#f1f3f4"/>
<text x="72" y="329" font-size="17" >Dead end</text>
<rect x="56" y="344" width="496" height="36" fill="#f1f3f4"/>
<text x="72" y="368" font-size="17" >New approach and conjecture</text>
<rect x="56" y="383" width="496" height="52" fill="#f1f3f4"/>
<text x="72" y="415" font-size="17" >More calculations</text>
<rect x="56" y="438" width="496" height="36" fill="#f1f3f4"/>
<text x="72" y="462" font-size="17" >Conjecture disproved</text>
<rect x="56" y="477" width="496" height="36" fill="#def0eb"/>
<text x="72" y="501" font-size="17" >Second result proved</text>
<rect x="56" y="516" width="496" height="36" fill="#f1f3f4"/>
<text x="72" y="540" font-size="17" >Next approach</text>
<path d="M37 86V548m-4 -5 4 5 4 -5" fill="none" stroke="#c7d0d4"/>
<text x="56" y="578" font-size="13" fill="#61717a">Context almost full</text>
</g>
</svg>
