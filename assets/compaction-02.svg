<path d="M598 432h104 M944 432h104" stroke="#c7d0d4"/>
<text x="823" y="437" font-size="13" text-anchor="middle" fill="#61717a">End of second compaction</text>
<rect x="598" y="457" width="450" height="219" fill="white" stroke="#c7d0d4" stroke-dasharray="5 5"/>
<text x="614" y="491" font-size="17" fill="#61717a">Room for new exploration</text>
<text x="540" y="391" font-size="15" text-anchor="middle" fill="#61717a">evolve</text>
